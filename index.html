<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheckRide V5 Enterprise</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Библиотека для PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header>
    <h1>CheckRide V5</h1>
</header>

<main>
    <!-- ЭКРАН 1: РЕГИСТРАЦИЯ И ВЫБОР РЕЖИМА -->
    <section id="screen-start" class="screen">
        <h2>Регистрация проверки</h2>
        
        <div class="mode-selector">
            <button type="button" id="btn-line" class="mode-btn active" onclick="setMode('line')">LINE</button>
            <button type="button" id="btn-ffs" class="mode-btn" onclick="setMode('ffs')">FFS</button>
        </div>

        <div class="input-group">
            <input type="text" id="fio" placeholder="ФИО специалиста">
            <input type="text" id="license" placeholder="Номер лицензии">
        </div>

        <button class="main-btn" onclick="startInspection()">Начать проверку</button>
        <button class="secondary-btn" onclick="showHistory()">История проверок</button>
    </section>

    <!-- ЭКРАН 2: ПРОЦЕСС ПРОВЕРКИ (ПОШАГОВЫЙ) -->
    <section id="screen-test" class="screen hidden">
        <div class="step-header">
            <h2 id="section-title">Preflight</h2>
            <div id="step-indicator"></div>
        </div>

        <div id="checklist"></div>
        
        <div class="navigation-controls">
            <button id="btn-prev" onclick="prevSection()">← Назад</button>
            <button id="btn-next" onclick="nextSection()">Далее →</button>
            <button id="btn-finish" class="finish-btn hidden" onclick="finishInspection()">Завершить проверку</button>
        </div>
    </section>

    <!-- ЭКРАН 3: ОТЧЕТ И ПОДПИСЬ -->
    <section id="screen-report" class="screen hidden">
        <div id="report-to-export">
            <div class="report-header">
                <h2>Отчет проверки</h2>
                <div class="meta-grid">
                    <p><b>Специалист:</b> <span id="r_fio"></span></p>
                    <p><b>Лицензия:</b> <span id="r_license"></span></p>
                    <p><b>Дата:</b> <span id="r_date"></span></p>
                    <p><b>Режим:</b> <span id="r_mode"></span></p>
                </div>
            </div>
            <hr>
            <div id="report_items_container"></div>
            
            <div class="signature-section">
                <p><b>Подпись специалиста:</b></p>
                <canvas id="signature" width="400" height="150"></canvas>
            </div>
        </div>

        <div class="report-actions">
            <button class="main-btn" onclick="exportPDF()">Скачать PDF</button>
            <button class="secondary-btn" onclick="resetApp()">Новая проверка</button>
        </div>
    </section>

    <!-- ЭКРАН 4: ИСТОРИЯ -->
    <section id="screen-history" class="screen hidden">
        <h2>История (LocalStorage)</h2>
        <div id="historyList"></div>
        <button class="secondary-btn" onclick="show('screen-start')">Назад</button>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
