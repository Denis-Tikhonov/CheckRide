<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheckRide V5 Enterprise</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header class="no-print">
    <div class="header-container">
        <!-- Замените 'logo.png' на путь к вашему файлу логотипа -->
        <img src="logo.svg" alt="Logo" class="logo">
        <h1>CheckRide Enterprise</h1>
    </div>
</header>

<main>
    <!-- ЭКРАН 1: СТАРТ -->
    <section id="screen-start" class="screen">
        <h2>Регистрация</h2>
        <div class="mode-selector">
            <button id="btn-line" class="mode-btn active" onclick="setMode('line')">LINE</button>
            <button id="btn-ffs" class="mode-btn" onclick="setMode('ffs')">FFS</button>
        </div>
        <input type="text" id="fio" placeholder="ФИО проверяемого">
        <input type="text" id="license" placeholder="Номер лицензии">
        <input type="text" id="instructor" placeholder="Проверяющий">
        <button class="main-btn" onclick="startInspection()">Начать проверку</button>
        <button class="secondary-btn" onclick="showHistory()">История</button>
    </section>

    <!-- Остальные секции (test, report, history) остаются без изменений как в предыдущем ответе -->
    <!-- ... -->
</main>

<script src="app.js"></script>
</body>
</html>
