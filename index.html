<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheckRide Rating V8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="no-print">
    <div class="header-container">
        <img src="logo.svg" alt="Logo" class="logo" onerror="this.style.display='none'">
        <h1>CheckRide Rating</h1>
    </div>
</header>

<main>
    <section id="screen-start" class="screen">
        <h2>Регистрация пилота</h2>
        <div class="mode-selector">
            <button id="btn-line" class="mode-btn active" onclick="setMode('line')">LINE</button>
            <button id="btn-ffs" class="mode-btn" onclick="setMode('ffs')">FFS</button>
        </div>
        <input type="text" id="fio" placeholder="ФИО проверяемого">
        <input type="text" id="license" placeholder="Номер лицензии">
        <input type="text" id="instructor" placeholder="Проверяющий (Инструктор)">
        <input type="text" id="route" placeholder="Маршрут (опционально)">
        <input type="text" id="ac_number" placeholder="Номер ВС (опционально)">
        
        <button class="main-btn" onclick="startInspection()">Начать проверку</button>
        <button class="secondary-btn" onclick="showHistory()">История проверок</button>
    </section>

    <section id="screen-test" class="screen hidden">
        <h2 id="section-title"></h2>
        <div id="checklist-items"></div>
        <div class="navigation-controls">
            <button id="btn-prev" class="nav-button" onclick="prevSection()">← Назад</button>
            <button id="btn-next" class="nav-button" onclick="nextSection()">Далее →</button>
            <button id="btn-finish" class="finish-btn hidden" onclick="finishInspection()">Завершить</button>
        </div>
    </section>

    <section id="screen-report" class="screen hidden">
        <div id="report-content">
            <h2 class="report-main-title">ОТЧЕТ ПО ПРОВЕРКЕ</h2>
            <div class="report-meta">
                <p><b>Проверяемый:</b> <span id="r_fio"></span></p>
                <p><b>Лицензия:</b> <span id="r_license"></span></p>
                <p><b>Дата:</b> <span id="r_date"></span></p>
                <p><b>Режим:</b> <span id="r_mode"></span></p>
                <p><b>Маршрут:</b> <span id="r_route"></span></p>
                <p><b>Номер ВС:</b> <span id="r_ac_number"></span></p>
                <p><b>Полетное время:</b> <span id="r_flight_time"></span></p>
            </div>
            <div id="report-data"></div>
            
            <div class="signature-section">
                <p><b>Проверяющий:</b> <span id="r_instructor"></span></p>
                <p><b>Подпись:</b></p>
                <canvas id="signature" width="500" height="150"></canvas>
                <div id="sig-image-placeholder"></div>
            </div>
        </div>
        
        <div class="no-print">
            <div style="margin-top:20px; border-top:1px solid #ccc; padding-top:15px;">
                <input type="text" id="flight_time" placeholder="Введите полетное время (напр. 02:30)">
            </div>
            <button class="main-btn" onclick="exportPDF()">Печать / Сохранить в PDF</button>
            <button class="secondary-btn" onclick="sendEmail()">Отправить по почте</button>
            <button class="secondary-btn" onclick="resetApp()">На главную</button>
        </div>
    </section>

    <section id="screen-history" class="screen hidden">
        <h2>История проверок</h2>
        <div id="historyList"></div>
        <button class="secondary-btn" onclick="clearHistory()" style="background:var(--red) !important;">Очистить историю</button>
        <button class="secondary-btn" onclick="show('screen-start')">Назад</button>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
