<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CheckRide V5 Enterprise</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<header>
<h1>CheckRide V5 Enterprise</h1>
</header>

<main>

<section id="screen-start" class="screen">
<h2>Регистрация проверки</h2>
<input id="fio" placeholder="ФИО специалиста">
<input id="license" placeholder="Номер лицензии">
<select id="checklistSelect"></select>
<button onclick="startTest()">Начать проверку</button>
</section>

<section id="screen-test" class="screen hidden">
<h2 id="section-title"></h2>
<div id="checklist"></div>
<canvas id="signature" width="400" height="150"></canvas>
<button onclick="finishTest()">Завершить проверку</button>
</section>

<section id="screen-report" class="screen hidden">
<h2>Отчет</h2>

<div id="report">
<p><b>Специалист:</b> <span id="r_fio"></span></p>
<p><b>Лицензия:</b> <span id="r_license"></span></p>
<p><b>Дата:</b> <span id="r_date"></span></p>
<hr>
<div id="report_items"></div>
</div>

<button onclick="exportPDF()">Скачать PDF</button>
<button onclick="showHistory()">История проверок</button>
<button onclick="resetApp()">Новая проверка</button>
</section>

<section id="screen-history" class="screen hidden">
<h2>История проверок</h2>
<div id="historyList"></div>
<button onclick="show('screen-start')">Назад</button>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
