<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheckRide V5 Enterprise</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header class="no-print">
    <div class="header-container">
        <!-- Файл должен называться logo.png и лежать в папке с index.html -->
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <h1>CheckRide Enterprise</h1>
    </div>
</header>

<main>
    <!-- ЭКРАН 1: СТАРТ -->
    <section id="screen-start" class="screen">
        <h2>Регистрация</h2>
        <div class="mode-selector">
            <button id="btn-line" class="mode-btn active" onclick="setMode('line')">LINE</button>
            <button id="btn-ffs" class="mode-btn" onclick="setMode('ffs')">FFS</button>
        </div>
        <input type="text" id="fio" placeholder="ФИО проверяемого">
        <input type="text" id="license" placeholder="Номер лицензии">
        <input type="text" id="instructor" placeholder="Проверяющий (Инструктор)">
        <button class="main-btn" onclick="startInspection()">Начать проверку</button>
        <button class="secondary-btn" onclick="showHistory()">История проверок</button>
    </section>

    <!-- ЭКРАН 2: ТЕСТ -->
    <section id="screen-test" class="screen hidden">
        <h2 id="section-title"></h2>
        
        <!-- Блок только для чекбоксов -->
        <div id="checklist-items"></div>
        
        <hr class="separator">
        <h3 class="sub-title">Комментарии и фото к блоку</h3>
        
        <!-- Блок для комментариев и фото (внизу) -->
        <div id="checklist-details"></div>

        <div class="navigation-controls">
            <button id="btn-prev" class="nav-button" onclick="prevSection()">← Назад</button>
            <button id="btn-next" class="nav-button" onclick="nextSection()">Далее →</button>
            <button id="btn-finish" class="finish-btn hidden" onclick="finishInspection()">Завершить</button>
        </div>
    </section>

    <!-- ЭКРАН 3: ОТЧЕТ -->
    <section id="screen-report" class="screen hidden">
        <div id="report-content">
            <h2 class="report-main-title">ОТЧЕТ ПО ПРОВЕРКЕ</h2>
            <div class="report-meta">
                <p><b>Проверяемый:</b> <span id="r_fio"></span></p>
                <p><b>Лицензия:</b> <span id="r_license"></span></p>
                <p><b>Дата:</b> <span id="r_date"></span></p>
                <p><b>Режим:</b> <span id="r_mode"></span></p>
            </div>
            
            <div id="report-data"></div>
            
            <div class="signature-section">
                <p><b>Проверяющий:</b> <span id="r_instructor"></span></p>
                <p><b>Подпись:</b></p>
                <canvas id="signature" width="400" height="150"></canvas>
                <div id="sig-image-placeholder"></div>
            </div>
        </div>
        
        <div class="no-print">
            <button class="main-btn" onclick="exportPDF()">Скачать PDF</button>
            <button class="secondary-btn" onclick="resetApp()">На главную</button>
        </div>
    </section>

    <!-- ЭКРАН 4: ИСТОРИЯ -->
    <section id="screen-history" class="screen hidden">
        <h2>История</h2>
        <div id="historyList"></div>
        <button class="secondary-btn clear-btn" onclick="clearHistory()">Очистить всё</button>
        <button class="secondary-btn" onclick="show('screen-start')">Назад</button>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
